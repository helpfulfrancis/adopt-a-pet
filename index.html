<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Virtual Pet Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SCREEN 1: ADOPTION & NAMING -->
    <div id="setup-screen" class="game-card">
        <h2>Adopt a Virtual Pet</h2>
        <p>Choose your pet companion:</p>
        <div class="pet-selector">
            <button class="type-btn" onclick="selectType(event, 'Dog')">🐶 Dog</button>
            <button class="type-btn" onclick="selectType(event, 'Cat')">🐱 Cat</button>
            <button class="type-btn" onclick="selectType(event, 'Hamster')">🐹 Hamster</button>
        </div>
        
        <p id="chosen-type-text">Selected: None</p>

        <div class="naming-section">
            <label for="pet-name-input">Give your pet a permanent name:</label>
            <input type="text" id="pet-name-input" placeholder="Enter name..." maxlength="15">
        </div>

        <button id="start-btn" onclick="startGame()">Bring Pet Home! ❤️</button>
    </div>

    <!-- SCREEN 2: MAIN GAMEPLAY -->
    <div id="game-screen" class="game-card hidden">
        <div class="top-bar">
            <h2 id="pet-display-name">Pet Name</h2>
            <div class="coin-display">🪙 Coins: <span id="coin-count">0</span></div>
        </div>

        <!-- The Pet Environment Area -->
        <div id="environment-area" class="env-cage">
            <!-- Heart Particle Container -->
            <div id="heart-container"></div>

            <!-- Full Body Pet Assembly -->
            <div id="pet-container">
                <!-- Accessories sit dynamically on top of coordinates -->
                <div id="acc-hat" class="pet-part layer-accessory hidden">🎩</div>
                <div id="acc-crown" class="pet-part layer-accessory hidden">👑</div>
                
                <div id="pet-head" class="pet-part">🐶</div>
                
                <div id="acc-glasses" class="pet-part layer-accessory hidden">🕶️</div>
                <div id="acc-bowtie" class="pet-part layer-accessory hidden">🎀</div>

                <div id="pet-body" class="pet-part">🦴</div>
                <div id="pet-legs" class="pet-part">🐾</div>
            </div>
            
            <div class="ground-tiles"></div>
        </div>

        <!-- Interactions & Actions Section -->
        <div class="action-section">
            <div class="feeding-ui">
                <p>Feeds remaining today: <span id="feed-count">7</span>/7</p>
                <button id="feed-btn" onclick="feedPet()">🍖 Feed Pet (+10 Coins)</button>
            </div>
            
            <div class="pet-interactions">
                <button class="interact-btn" onclick="petNoise()">🔊 Make Noise</button>
                <button class="interact-btn" onclick="petJump()">🦘 Jump</button>
                <button class="interact-btn" onclick="petCuddle()">💖 Cuddle Pet</button>
            </div>
        </div>

        <hr>

        <!-- The Shop Area -->
        <div class="shop-section">
            <h3>🛒 The Pet Shop</h3>
            
            <div class="shop-category">
                <h4>Accessories</h4>
                <button class="shop-btn" id="item-hat" onclick="buyItem('hat', 'acc', 20)">🎩 Fancy Hat (20 🪙)</button>
                <button class="shop-btn" id="item-crown" onclick="buyItem('crown', 'acc', 50)">👑 Royal Crown (50 🪙)</button>
                <button class="shop-btn" id="item-glasses" onclick="buyItem('glasses', 'acc', 30)">🕶️ Sunglasses (30 🪙)</button>
                <button class="shop-btn" id="item-bowtie" onclick="buyItem('bowtie', 'acc', 25)">🎀 Cute Bowtie (25 🪙)</button>
            </div>

            <div class="shop-category">
                <h4>Environments</h4>
                <button class="shop-btn" id="env-grass" onclick="buyItem('grass', 'env', 40)">🏡 Green Grass (40 🪙)</button>
                <button class="shop-btn" id="env-house" onclick="buyItem('house', 'env', 60)">🏰 Luxury House (60 🪙)</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
